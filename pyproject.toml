[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-message-gateway"
version = "0.1.0"
description = "Showcase extract: an email-driven task coordinator where an LLM classifies intent and Python enforces every rule."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muhammad Hussain" }]
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "google-api-python-client>=2.110",
    "google-auth>=2.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
workbook = ["openpyxl>=3.1"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["message_gateway"]
